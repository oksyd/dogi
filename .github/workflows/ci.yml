name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            gettext \
            libfontconfig1-dev \
            libglib2.0-dev \
            libxml2-utils \
            udev

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo sources
        id: cargo-sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore debug build cache
        id: cargo-debug
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: cargo-build-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-build-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Validate translations
        run: |
          catalog=crates/dogi-ui/i18n/zh_CN/LC_MESSAGES/dogi-ui.po
          msgfmt --check --check-format --output-file=/dev/null "$catalog"
          if msgattrib --untranslated --no-obsolete "$catalog" | grep -Eq '^msgid ".+"$'; then
            echo "translation catalog contains untranslated messages" >&2
            msgattrib --untranslated --no-obsolete "$catalog" >&2
            exit 1
          fi
          if msgattrib --only-fuzzy --no-obsolete "$catalog" | grep -Eq '^msgid ".+"$'; then
            echo "translation catalog contains fuzzy messages" >&2
            msgattrib --only-fuzzy --no-obsolete "$catalog" >&2
            exit 1
          fi

      - name: Validate Linux integration metadata
        run: |
          desktop-file-validate packaging/linux/io.github.oksyd.dogi.desktop
          appstreamcli validate --pedantic --no-net packaging/linux/io.github.oksyd.dogi.metainfo.xml
          xmllint --noout \
            packaging/linux/io.github.oksyd.dogi.metainfo.xml \
            packaging/linux/io.github.oksyd.dogi.svg
          udevadm verify crates/dogi/assets/linux/70-dogi-logitech.rules

      - name: Validate Cargo package boundary
        run: |
          package_files=$(cargo package --locked --package dogi --list)
          grep -Fxq assets/linux/70-dogi-logitech.rules <<<"$package_files"
          grep -Fxq assets/linux/dogi-runtime.service.in <<<"$package_files"

      - name: Save Cargo sources
        if: github.ref == 'refs/heads/main' && steps.cargo-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}

      - name: Save debug build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-debug.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: ${{ steps.cargo-debug.outputs.cache-primary-key }}
