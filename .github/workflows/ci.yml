name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            libfontconfig1-dev \
            libxml2-utils \
            udev

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Validate Linux integration metadata
        run: |
          desktop-file-validate packaging/linux/io.github.oksyd.dogi.desktop
          appstreamcli validate --pedantic --no-net packaging/linux/io.github.oksyd.dogi.metainfo.xml
          xmllint --noout \
            packaging/linux/io.github.oksyd.dogi.metainfo.xml \
            packaging/linux/io.github.oksyd.dogi.svg
          udevadm verify crates/dogi/assets/linux/70-dogi-logitech.rules

      - name: Validate Cargo package boundary
        run: |
          package_files=$(cargo package --locked --package dogi --list)
          grep -Fxq assets/linux/70-dogi-logitech.rules <<<"$package_files"
          grep -Fxq assets/linux/dogi-runtime.service.in <<<"$package_files"

  package:
    name: Package
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            dpkg-dev \
            libfontconfig1-dev \
            zstd

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Build release assets
        run: ./packaging/build-release.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogi-linux-packages-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
