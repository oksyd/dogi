name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            libfontconfig1-dev \
            libglib2.0-dev \
            libxml2-utils \
            udev

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo sources
        id: cargo-sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore debug build cache
        id: cargo-debug
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Validate Linux integration metadata
        run: |
          desktop-file-validate packaging/linux/io.github.oksyd.dogi.desktop
          appstreamcli validate --pedantic --no-net packaging/linux/io.github.oksyd.dogi.metainfo.xml
          xmllint --noout \
            packaging/linux/io.github.oksyd.dogi.metainfo.xml \
            packaging/linux/io.github.oksyd.dogi.svg
          udevadm verify crates/dogi/assets/linux/70-dogi-logitech.rules

      - name: Validate Cargo package boundary
        run: |
          package_files=$(cargo package --locked --package dogi --list)
          grep -Fxq assets/linux/70-dogi-logitech.rules <<<"$package_files"
          grep -Fxq assets/linux/dogi-runtime.service.in <<<"$package_files"

      - name: Save Cargo sources
        if: github.ref == 'refs/heads/main' && steps.cargo-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}

      - name: Save debug build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-debug.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: ${{ steps.cargo-debug.outputs.cache-primary-key }}

  package:
    name: Package
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      release-tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            dpkg-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            zstd

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore release build cache
        id: cargo-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release/
          key: cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-release-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-release-

      - name: Resolve signed release tag
        id: release-tag
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          mapfile -t release_tags < <(
            git tag --points-at "$RELEASE_COMMIT" --list \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | LC_ALL=C sort -V \
              || true
          )
          if (( ${#release_tags[@]} > 1 )); then
            echo "multiple stable release tags point at $RELEASE_COMMIT" >&2
            printf '%s\n' "${release_tags[@]}" >&2
            exit 1
          fi
          release_tag=${release_tags[0]:-}
          if [[ -n "$release_tag" ]]; then
            git -c gpg.format=ssh \
              -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/packaging/release-signers" \
              verify-tag "$release_tag"
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        env:
          DOGI_RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: ./packaging/build-release.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Generate checksums
        run: |
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS

      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.zst

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogi-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Save release build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release/
          key: ${{ steps.cargo-release.outputs.cache-primary-key }}

  promote:
    name: Promote verified CI assets
    needs: package
    if: needs.package.outputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be an unprefixed stable version: $RELEASE_TAG" >&2
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/packaging/release-signers" \
            verify-tag "$RELEASE_TAG"
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "release tag $RELEASE_TAG does not point at $RELEASE_COMMIT" >&2
            exit 1
          fi

      - name: Download verified package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogi-release-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
        run: |
          expected_portable="dogi-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.zst"
          expected_debian="dogi_${RELEASE_TAG}_amd64.deb"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(SHA256SUMS "$expected_portable" "$expected_debian")
          if [[ "${assets[*]}" != "${expected[*]}" ]]; then
            echo "unexpected release asset set" >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            printf 'actual:   %s\n' "${assets[*]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum --check --strict SHA256SUMS
          )
          package_version=$(dpkg-deb --field "dist/$expected_debian" Version)
          package_architecture=$(dpkg-deb --field "dist/$expected_debian" Architecture)
          if [[ "$package_version" != "$RELEASE_TAG" ]]; then
            echo "Debian package version $package_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$package_architecture" != amd64 ]]; then
            echo "unexpected Debian package architecture: $package_architecture" >&2
            exit 1
          fi

      - name: Verify build provenance
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          for asset in dist/*.deb dist/*.tar.zst; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$RELEASE_COMMIT" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != true ]]; then
              echo "refusing to replace assets on published release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --generate-notes \
              --title "Dogi $RELEASE_TAG" \
              --verify-tag
          fi
