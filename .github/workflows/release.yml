name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified CI assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be an unprefixed stable version: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/packaging/release-signers" \
            verify-tag "$GITHUB_REF_NAME"
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve successful main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          run_id=$(
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$RELEASE_COMMIT&per_page=100" \
              --jq '.workflow_runs[0].id // empty'
          )
          if [[ -z "$run_id" ]]; then
            echo "no successful main CI run exists for release commit $RELEASE_COMMIT" >&2
            echo "wait for that commit's CI workflow to succeed, then rerun this workflow" >&2
            exit 1
          fi
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogi-release-${{ steps.tag.outputs.commit }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run-id }}
          digest-mismatch: error

      - name: Verify release assets
        run: |
          expected_portable="dogi-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.zst"
          expected_debian="dogi_${GITHUB_REF_NAME}_amd64.deb"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(SHA256SUMS "$expected_portable" "$expected_debian")
          if [[ "${assets[*]}" != "${expected[*]}" ]]; then
            echo "unexpected release asset set" >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            printf 'actual:   %s\n' "${assets[*]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum --check --strict SHA256SUMS
          )
          package_version=$(dpkg-deb --field "dist/$expected_debian" Version)
          package_architecture=$(dpkg-deb --field "dist/$expected_debian" Architecture)
          if [[ "$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Debian package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$package_architecture" != amd64 ]]; then
            echo "unexpected Debian package architecture: $package_architecture" >&2
            exit 1
          fi

      - name: Verify build provenance
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          for asset in dist/*.deb dist/*.tar.zst; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$RELEASE_COMMIT" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != true ]]; then
              echo "refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --generate-notes \
              --title "Dogi $GITHUB_REF_NAME" \
              --verify-tag
          fi
