name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            binutils \
            desktop-file-utils \
            dpkg-dev \
            libfontconfig1-dev \
            libxml2-utils \
            udev \
            zstd

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Validate tagged source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          desktop-file-validate packaging/linux/io.github.oksyd.dogi.desktop
          appstreamcli validate --pedantic --no-net packaging/linux/io.github.oksyd.dogi.metainfo.xml
          xmllint --noout \
            packaging/linux/io.github.oksyd.dogi.metainfo.xml \
            packaging/linux/io.github.oksyd.dogi.svg
          udevadm verify crates/dogi/assets/linux/70-dogi-logitech.rules

      - name: Build release assets
        env:
          DOGI_RELEASE_TAG: ${{ github.ref_name }}
        run: ./packaging/build-release.sh

      - name: Resolve Debian package
        id: package
        run: |
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -print)
          if (( ${#packages[@]} != 1 )); then
            echo "expected exactly one Debian package, found ${#packages[@]}" >&2
            exit 1
          fi
          printf 'deb=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate Debian package SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.package.outputs.deb }}
          format: spdx-json
          output-file: dist/dogi-${{ github.ref_name }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogi-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest release assets
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogi-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.zst
            dist/*.spdx.json

      - name: Attest Debian package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.deb
          sbom-path: dist/dogi-${{ github.ref_name }}.spdx.json

  draft-release:
    name: Create draft release
    needs: [build, attest]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogi-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != true ]]; then
              echo "refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --generate-notes \
              --title "Dogi $GITHUB_REF_NAME" \
              --verify-tag
          fi
