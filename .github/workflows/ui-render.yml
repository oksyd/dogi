name: UI rendering

on:
  pull_request:
    paths:
      - src/**
      - packaging/linux/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ui-render.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-render-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-dejavu-mono \
            fonts-droid-fallback \
            libfontconfig1-dev \
            libglib2.0-dev

      - name: Prepare Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore debug build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: cargo-build-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-build-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-

      - name: Render representative states
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/src/ui/tests/preview-fontconfig.conf
          LC_ALL: C.UTF-8
        run: |
          status=0

          render() {
            local name=$1
            shift
            printf 'Rendering %s\n' "$name"
            if ! env \
              "$@" \
              cargo test --locked --bin dogi \
                ui::tests::renders_preview -- --exact; then
              status=1
            fi
          }

          render default
          render multi-device DOGI_UI_SNAPSHOT_MULTI=1
          render permission-error DOGI_UI_SNAPSHOT_ACCESS=permission
          render gestures DOGI_UI_SNAPSHOT_GESTURES=1
          render app-profiles DOGI_UI_SNAPSHOT_APP_PROFILE_EDITOR=1
          render settings DOGI_UI_SNAPSHOT_PAGE=3
          render settings-update-ready DOGI_UI_SNAPSHOT_PAGE=3 DOGI_UI_SNAPSHOT_UPDATE_READY=0.2.0
          render update-restart-confirmation DOGI_UI_SNAPSHOT_UPDATE_READY=0.2.0 DOGI_UI_SNAPSHOT_UPDATE_CONFIRM=1
          render settings-dark DOGI_UI_SNAPSHOT_PAGE=3 DOGI_UI_SNAPSHOT_THEME=2
          render settings-zh-cn DOGI_UI_SNAPSHOT_PAGE=3 DOGI_UI_SNAPSHOT_LOCALE=zh_CN
          render proxy-settings DOGI_UI_SNAPSHOT_PROXY=manual
          render proxy-settings-zh-cn DOGI_UI_SNAPSHOT_PROXY=authenticated DOGI_UI_SNAPSHOT_LOCALE=zh_CN
          render language-menu DOGI_UI_SNAPSHOT_LANGUAGE_MENU=1

          exit "$status"
