[workspace]
resolver = "3"
members = [
    "crates/dogi",
    "crates/dogi-core",
    "crates/dogi-hid",
    "crates/dogi-ui",
]
default-members = ["crates/dogi"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/oksyd/dogi"
repository = "https://github.com/oksyd/dogi"

[workspace.dependencies]
dogi-core = { version = "0.1.3", path = "crates/dogi-core", default-features = false }
dogi-hid = { version = "0.1.3", path = "crates/dogi-hid", default-features = false }
dogi-ui = { version = "0.1.3", path = "crates/dogi-ui", default-features = false }

clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
semver = { version = "1.0.28", default-features = false, features = ["std"] }

libc = { version = "0.2.186", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }
tar = { version = "0.4.44", default-features = false }
ureq = { version = "3.3.0", default-features = false, features = ["json", "platform-verifier", "rustls"] }
zstd = { version = "0.13.3", default-features = false }
zbus = { version = "5.16.0", default-features = false, features = ["async-io", "blocking-api"] }

slint = { version = "1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg", "renderer-software", "std", "system-tray"] }
slint-build = { version = "1.17.1", default-features = false, features = ["default"] }

slint-snapshot = { version = "0.1.1", default-features = false }

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
publish = false
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
pre-release-commit-message = "chore: release {{version}}"
tag-message = "chore: release {{version}}"
pre-release-hook = [
    "bash",
    "-euc",
    "if [[ $DRY_RUN == true ]]; then exit 0; fi; root=\"$(git rev-parse --show-toplevel)\"; cd \"$root\"; if [[ -f CHANGELOG.md ]] && head -n 1 CHANGELOG.md | grep -Fq \"## [$1]\"; then exit 0; fi; git cliff -o CHANGELOG.md --tag \"$1\"",
    "--",
    "{{version}}",
]
pre-release-replacements = [
    { file = "../../packaging/linux/io.github.oksyd.dogi.metainfo.xml", search = '<release version="[^"]+" date="[0-9]{4}-[0-9]{2}-[0-9]{2}" type="development">', replace = '<release version="{{version}}" date="{{date}}" type="development">', exactly = 1 },
]
